# Render blueprint -- backend API + the Expo web build.
#
# Both services read their secrets from the Render dashboard, never from this file:
# sync:false means Render prompts for the value and never stores it in the repo.
#
# See DEPLOY.md for what to paste into each one.

services:
  # ---------------------------------------------------------------- backend API
  - type: web
    name: emotion-tracker-matan-api
    runtime: node
    # plan: free
    # Permanent once the service exists. Firestore is eur3 (multi-region Europe);
    # Frankfurt is the closest Render region.
    region: frankfurt
    # No rootDir. The server compiles ../shared, and Render hides everything outside
    # a service's root directory at build AND run time (tsc fails on every shared
    # import). The build runs from the repo root, scoped to server/ with --prefix.
    # --include=dev: NODE_ENV=production would otherwise skip typescript.
    buildCommand: npm ci --prefix server --include=dev && npm run build --prefix server
    # tsconfig's rootDir is the repo root (it compiles ../shared), so tsc writes the
    # entry to server/dist/server/src/index.js -- verified by building, not assumed.
    # node directly rather than `npm start`, so Render's SIGTERM reaches the process.
    startCommand: node server/dist/server/src/index.js
    healthCheckPath: /healthz
    # With no rootDir, every commit would redeploy the API. Paths are relative to
    # the repo root. shared/ stays in: the server compiles it.
    buildFilter:
      paths:
        - server/**
        - shared/**
        - render.yaml
      ignoredPaths:
        - server/**/*.test.ts
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      # Points Application Default Credentials at the Render Secret File holding the
      # service account key. Secret files can't be declared in a Blueprint -- add
      # serviceAccount.json under the service's Environment tab (see DEPLOY.md).
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/serviceAccount.json
      # Render terminates TLS at a proxy; without this every request looks like it
      # came from one IP and the rate limiter throttles all users together.
      - key: TRUST_PROXY
        value: "true"
      # The static site's origin, once it has one. '*' only while testing.
      - key: CORS_ORIGIN
        sync: false

  # ------------------------------------------------------------- frontend (web)
  # Expo web export. The native app does not come from here -- it is built with
  # EAS and shipped to the stores; this is the browser build only.
  # - type: web
  #   name: mood-tracker-web
  #   runtime: static
  #   plan: free
  #   buildCommand: npm install && npx expo export --platform web
  #   staticPublishPath: ./dist
  #   envVars:
  #     # react-native-dotenv inlines these AT BUILD TIME, so they must be set here,
  #     # not at runtime. Changing one requires a rebuild, not a restart.
  #     - key: API_URL
  #       sync: false
  #     - key: FIREBASE_API_KEY
  #       sync: false
  #     - key: FIREBASE_AUTH_DOMAIN
  #       sync: false
  #     - key: FIREBASE_PROJECT_ID
  #       sync: false
  #     - key: FIREBASE_STORAGE_BUCKET
  #       sync: false
  #     - key: FIREBASE_MESSAGING_SENDER_ID
  #       sync: false
  #     - key: FIREBASE_APP_ID
  #       sync: false
  #   routes:
  #     # Expo Router/React Navigation own the URL, so any deep link has to be served
  #     # index.html rather than 404ing on a path with no file behind it.
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html
